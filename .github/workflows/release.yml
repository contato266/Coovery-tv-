name: Android CI and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.app_version.outputs.version_name }}
      version_code: ${{ steps.app_version.outputs.version_code }}
      release_tag: ${{ steps.app_version.outputs.release_tag }}
      apk_name: ${{ steps.app_version.outputs.apk_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Failed to read app version from app/build.gradle.kts"
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=Coovery-tv+-$VERSION_NAME.apk" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare optional signing files
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            mkdir -p keystore
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
            printf '%s\n' \
              'storeFile=keystore/release.jks' \
              "storePassword=$RELEASE_STORE_PASSWORD" \
              "keyAlias=$RELEASE_KEY_ALIAS" \
              "keyPassword=$RELEASE_KEY_PASSWORD" \
              > keystore.properties
            echo "Release signing files prepared."
          else
            echo "No signing secrets configured. Building unsigned release APK."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test CI helper scripts
        shell: bash
        run: |
          for test_script in tools/tests/*-test.sh; do
            bash "$test_script"
          done

      - name: Run unit tests, lint, and coverage
        run: ./gradlew --console=plain testStandardDebugUnitTest :app:lintStandardDebug :data:lintDebug :player:lintDebug verifyLintBaseline koverXmlReportCi koverHtmlReportCi

      - name: Compile instrumentation release gates
        run: ./gradlew --console=plain :app:assembleStandardDebugAndroidTest :data:assembleDebugAndroidTest

      - name: Build release APKs
        run: ./gradlew --console=plain :app:assembleStandardRelease :app:assemblePcRelease

      - name: Prepare release artifact
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          mkdir -p dist
          STANDARD_APK=$(find app/build/outputs/apk/standard/release -maxdepth 1 -name '*.apk' | head -n 1)
          PC_APK=$(find app/build/outputs/apk/pc/release -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$STANDARD_APK" ] || [ -z "$PC_APK" ]; then
            echo "Missing release APK (standard=$STANDARD_APK pc=$PC_APK)."
            exit 1
          fi
          cp "$STANDARD_APK" "dist/${{ steps.app_version.outputs.apk_name }}"
          cp "$STANDARD_APK" dist/Coovery.apk
          cp "$PC_APK" "dist/Coovery-tv+-PC-${{ steps.app_version.outputs.version_name }}.apk"
          cp "$PC_APK" dist/Coovery-PC.apk

      - name: Upload release APK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            dist/${{ steps.app_version.outputs.apk_name }}
            dist/Coovery.apk
            dist/Coovery-tv+-PC-${{ steps.app_version.outputs.version_name }}.apk
            dist/Coovery-PC.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            data/build/reports/tests/
            domain/build/reports/tests/
            player/build/reports/tests/

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            build/reports/kover/

  publish-release:
    if: github.event_name == 'workflow_dispatch'
    needs: [build, platform-smoke]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: dist

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Failed to read app version from app/build.gradle.kts"
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=Coovery-tv+-$VERSION_NAME.apk" >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry
        id: changelog
        shell: bash
        run: |
          VERSION="${{ steps.app_version.outputs.version_name }}"
          echo "Extracting notes for version $VERSION"
          
          # Extract lines between the header and the next header (or EOF)
          # Supports both "## [1.0.5] - date" and legacy "## 1.0.5 date" styles.
          {
            echo "notes<<EOF"
            awk -v ver="$VERSION" '
              $0 ~ ("^## \\[" ver "\\]") || $0 ~ ("^## " ver " ") { p=1; next }
              $0 ~ "^## " && p { p=0 }
              p { print }
            ' docs/CHANGELOG.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.release_tag }}
          name: Coovery tv+ ${{ steps.app_version.outputs.version_name }}
          body: |
            ${{ steps.changelog.outputs.notes }}
            
            ---
            Built from `${{ github.sha }}`.
          files: |
            dist/${{ steps.app_version.outputs.apk_name }}
            dist/Coovery.apk
            dist/Coovery-tv+-PC-${{ steps.app_version.outputs.version_name }}.apk
            dist/Coovery-PC.apk
          make_latest: true
          generate_release_notes: false

  platform-smoke:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/platform-smoke.yml
